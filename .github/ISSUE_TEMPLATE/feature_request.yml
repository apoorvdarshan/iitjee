name: Feature request
description: Suggest an improvement to the app or website
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A clear description of the problem helps more than a solution alone.
        Please check [existing issues](https://github.com/apoorvdarshan/iitjee/issues?q=is%3Aissue) first.
  - type: dropdown
    id: area
    attributes:
      label: Where would this help?
      multiple: true
      options:
        - iPhone app
        - iPad app
        - Website
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, screenshots or links are welcome.
